name: PokeWatch

on:
  schedule:
    # Toutes les 15 min (minutes décalées : GitHub est surchargé pile à l'heure)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pokewatch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Notification de test
        if: ${{ inputs.test }}
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./pokewatch.ps1 -Cloud -Test

      - name: Vérifier les boutiques
        shell: pwsh
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./pokewatch.ps1 -Cloud

      - name: Mémoriser ce qui a déjà été signalé
        run: |
          [ -f etat-cloud.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat-cloud.json
          git diff --cached --quiet || (git commit -m "Mise à jour de l'état" && git push)
